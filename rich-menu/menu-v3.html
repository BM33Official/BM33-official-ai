<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"LS";font-weight:800;src:url("../public/fonts/LINESeedSansTH_W_XBd.woff2")}
@font-face{font-family:"LS";font-weight:700;src:url("../public/fonts/LINESeedSansTH_W_Bd.woff2")}
html,body{margin:0;width:2500px;height:1686px;overflow:hidden;background:#0b1026;font-family:"LS",sans-serif;color:#fff}
.grid{position:absolute;left:0;top:0;width:2500px;height:1500px;display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:750px 750px}
.t{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;box-shadow:inset 0 0 0 5px rgba(11,16,38,.9)}
.t::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 20% 0%,rgba(255,255,255,.32),transparent 60%)}
.t svg{position:relative;width:360px;height:360px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.t h2{position:relative;margin:0;font-weight:800;font-size:112px;letter-spacing:-2px;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.22)}
.t small{position:absolute;top:40px;right:48px;font-weight:700;font-size:44px;opacity:.85}
.blue{background:linear-gradient(160deg,#4f8dff,#1d4ed8)} .green{background:linear-gradient(160deg,#34d399,#059669)}
.violet{background:linear-gradient(160deg,#a78bfa,#6d28d9)} .teal{background:linear-gradient(160deg,#22d3ee,#0e7490)}
.gold{background:linear-gradient(160deg,#fde047,#f59e0b);color:#422006} .gold h2{text-shadow:none}
.pink{background:linear-gradient(160deg,#fb7185,#be185d)}
.ask{position:absolute;left:0;top:1500px;width:2500px;height:186px;display:flex;align-items:center;justify-content:center;gap:30px;background:#0b1026;font-weight:800;font-size:76px}
.ask svg{width:96px;height:96px}
.ask span{opacity:.6;font-weight:700;font-size:52px}
</style></head><body>
<div class="grid">
<div class="t blue"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><h2>ประกาศ</h2></div>
<div class="t green"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg><h2>ต้องกรอก</h2></div>
<div class="t violet"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg><h2>ตารางเรียน</h2></div>
<div class="t teal"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><h2>ของฉัน</h2><small>เงินรุ่น</small></div>
<div class="t gold"><svg viewBox="0 0 24 24" fill="none" stroke="#422006" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/><path d="M12 3v6.6M12 14.4V21M3 12h6.6M14.4 12H21M5.6 5.6l4.7 4.7M13.7 13.7l4.7 4.7M18.4 5.6l-4.7 4.7M10.3 13.7l-4.7 4.7" stroke-width="1.4"/></svg><h2>เซียมซี</h2></div>
<div class="t pink"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg><h2>LinkTree</h2><small>วิชาการ</small></div>
</div>
<div class="ask"><svg viewBox="0 0 24 24" fill="none" stroke="#7cc4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>ถาม AI <span>พิมพ์ถามในแชตนี้ได้ทุกเรื่อง</span></div>
</body></html>
