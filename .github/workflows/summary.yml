# งานอัตโนมัติของแอปสมาชิก (เวลา UTC):
#   22:35 UTC = 05:35 น. ไทย -> ร่าง "สรุปวันนี้" บนแอป (mode=daily)
#   01:00 UTC = 08:00 น. ไทย -> คิวเตือนเดดไลน์/สอบ/ผลสุ่ม เข้ากล่องรอตรวจ (mode=due)
# (broadcast.yml ทุก 15 นาทีก็เรียกงานเหล่านี้ด้วย — ไฟล์นี้เป็นตัวสำรองให้ตรงเวลา)
# ใช้ secret เดียวกับ broadcast (BROADCAST_URL + BROADCAST_CRON_SECRET)
name: bm33-summary-cron

on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily หรือ due"
        default: "daily"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger summary cron
        run: |
          MODE="due"
          if [ "${{ github.event.schedule }}" = "35 22 * * *" ]; then MODE="daily"; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          BASE="${{ secrets.BROADCAST_URL }}"
          URL="${BASE/broadcast-cron/summary-cron}?mode=$MODE"
          echo "calling $URL"
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" -H "x-cron-secret: ${{ secrets.BROADCAST_CRON_SECRET }}" "$URL")
          echo "HTTP $code"; cat /tmp/out.txt
          test "$code" = "200"
